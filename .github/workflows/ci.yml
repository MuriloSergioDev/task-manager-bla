name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpass
          POSTGRES_DB: taskdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskuser -d taskdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      # Integration tests run against real Postgres (see README "Database
      # testing strategy"). CI-only values, not secrets.
      DATABASE_URL: postgresql+asyncpg://taskuser:taskpass@localhost:5432/taskdb_test
      JWT_SECRET_KEY: ci-only-test-secret-key-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v5
      # Python version from backend/.python-version, packages from uv.lock:
      # --frozen fails the job if the lockfile is out of date.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --extra dev --frozen
      # The same hooks a developer runs on commit. oxlint is skipped here
      # because the frontend job runs it.
      - run: uv run --frozen --project backend pre-commit run --all-files --show-diff-on-failure
        working-directory: .
        env:
          SKIP: oxlint
          PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit
      - run: uv run --frozen mypy app
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint, unit tests, strict build, Storybook a11y)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - run: npm run test:storybook

  e2e:
    name: End-to-end (Docker Compose stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      # Install the test tooling before the stack starts: Compose's anonymous
      # /app/node_modules volume needs a mount point, and if frontend/node_modules
      # doesn't exist yet Docker creates it on the host as root, which then
      # makes `npm ci` fail with EACCES.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # The same setup steps the README gives a new developer.
      - run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T api python -m scripts.seed
      - name: Wait for the Vite dev server
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173 > /dev/null && exit 0
            sleep 2
          done
          docker compose logs frontend
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=200
